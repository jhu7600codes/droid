<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Droid">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/brand/droid-d-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
<title>Droid</title>
</head>
<body>
<div id="screen"></div>
<script>
// if the app code itself fails to load (old browser, broken download), say so instead of a black screen
window.__early = [];
addEventListener('error', function (e) { __early.push((e.message || 'load error') + ' ' + ((e.filename || (e.target && (e.target.src || e.target.href)) || '') + '').split('/').pop()); }, true);
setTimeout(function () {
  if (window.droid_shell || document.getElementById('boot-errors')) return;
  var b = document.createElement('div');
  b.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;background:#300;color:#fff;font:12px monospace;padding:10px;z-index:99;border:1px solid #f44;white-space:pre-wrap';
  b.textContent = 'Droid did not start.\n' + navigator.userAgent + '\n\n' + (__early.join('\n') || 'no errors were reported');
  document.body.appendChild(b);
}, 25000);
</script>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
