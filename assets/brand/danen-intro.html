<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>danen play services intro</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #intro { position: fixed; inset: 0; background: #000; cursor: pointer; }
  #shot, #mark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #shot { opacity: 0; }
  #shot svg { width: 100%; height: 100%; }
  #mark { flex-direction: column; gap: 3vmin; opacity: 0; }
  #mark svg { width: 24vmin; height: 24vmin; }
  #powered { position: absolute; left: 0; right: 0; bottom: 6vmin; text-align: center; opacity: 0;
    font-family: "roboto", "helvetica neue", arial, sans-serif; font-weight: 300; }
  #pb { font-size: 2.8vmin; letter-spacing: .08em; color: #8a94a3; margin-bottom: 1vmin; }
  #wm { font-size: 8.5vmin; letter-spacing: .03em; color: #e8eef5; line-height: 1.2; }
  #wm svg { width: 1.65em; height: 1.65em; vertical-align: -.47em; margin: 0 -.06em 0 .02em; }

  #zoom { transform-box: view-box; transform-origin: 100px 52px; }
  #glow { opacity: 0; }
  .peck, .fly, .hop { transform-box: view-box; }
  .wing { transform-box: fill-box; transform-origin: 10% 90%; }
  #eye { transform-box: fill-box; transform-origin: center; }

  #intro.run #shot { animation: shot-in 1.2s ease forwards, shot-out 1s 5.9s ease-in forwards; }
  #intro.run #zoom { animation: zoom 1.9s 3s cubic-bezier(.45, 0, .2, 1) forwards; }
  #intro.run #glow { animation: glow 1.6s 3.6s ease forwards; }
  #intro.run .hop { animation: hop 1.2s 1.5s ease-in-out; }
  #intro.run .peck { animation: peck 1.1s ease-in-out infinite; }
  #intro.run .fly { animation: fly var(--dur) var(--delay) cubic-bezier(.35, 0, .8, .6) forwards; }
  #intro.run .wing { animation: flap .16s var(--delay) infinite alternate; }
  #intro.run #eye { animation: blink .3s 5.2s; }
  #intro.run #mark { animation: mark-in 1.1s 6.5s ease-out forwards; }
  #intro.run #powered { animation: fade .8s 7.7s ease forwards; }

  @keyframes shot-in { to { opacity: 1; } }
  @keyframes shot-out { from { opacity: 1; filter: blur(0); } to { opacity: 0; filter: blur(28px); } }
  @keyframes zoom { from { transform: translate(0, 0) scale(1); } to { transform: translate(-20px, -7px) scale(3.4); } }
  @keyframes glow { to { opacity: .16; } }
  @keyframes hop { 0%, 50%, 100% { transform: translateY(0); } 25% { transform: translateY(-5px); } 75% { transform: translateY(-3px); } }
  @keyframes peck { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(.7px); } }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.5); opacity: 0; } }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.6); } }
  @keyframes blink { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.1); } }
  @keyframes mark-in { from { opacity: 0; filter: blur(16px); transform: scale(.9); } to { opacity: 1; filter: blur(0); transform: none; } }
  @keyframes fade { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    #intro.run #shot { animation: none; opacity: 0; }
    #intro.run #mark, #intro.run #powered { animation: none; opacity: 1; filter: none; transform: none; }
  }
</style>
</head>
<body>
<div id="intro">
  <div id="shot">
    <svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" role="img" aria-label="a pigeon in a field, the flock flies away">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1d2c"/><stop offset="1" stop-color="#2f6070"/></linearGradient>
        <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e6b2f"/><stop offset="1" stop-color="#143a1c"/></linearGradient>
      </defs>
      <g id="zoom">
        <rect width="160" height="48" fill="url(#sky)"/>
        <circle cx="122" cy="34" r="6" fill="#ffbb33" opacity=".85"/>
        <path d="M0 44 Q30 36 60 42 T120 40 T160 43 V50 H0 Z" fill="#1e4a2c"/>
        <rect y="44" width="160" height="46" fill="url(#field)"/>
        <g id="flock"></g>
        <circle id="glow" cx="100" cy="52" r="16" fill="#33b5e5"/>
        <g class="hop">
          <g transform="translate(88,42) scale(.24)">
            <path d="M10 100 C8 84 20 70 40 68 L74 64 C92 66 96 84 96 100 Z" fill="#4a4f57"/>
            <path d="M58 100 C60 86 74 76 92 80 L96 100 Z" fill="#0099cc"/>
            <path d="M27 38 Q17 40 11 44 Q17 47.5 28 47 Z" fill="#ffbb33"/>
            <path d="M26 38 C30 28 40 22 52 22 C62 22 68 30 69 40 C70 52 70 60 76 66 Q54 86 28 76 C34 66 34 54 28 47 Z" fill="#0099cc"/>
            <path d="M26 38 C30 28 40 22 52 22 C62 22 68 30 69 40 C68 50 58 56 45 56 C36 55 30 51 28 47 Z" fill="#33b5e5"/>
            <ellipse cx="27.5" cy="40.5" rx="3.2" ry="2.6" fill="#7fd4f0"/>
            <path d="M28 76 Q54 86 76 66" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
            <circle cx="45" cy="33" r="5" fill="#fff"/>
            <g id="eye"><circle cx="45" cy="33" r="3.8" fill="#000"/><circle cx="46.2" cy="31.8" r="1.1" fill="#fff"/></g>
          </g>
        </g>
        <path id="grass" fill="#0d2412"/>
      </g>
    </svg>
  </div>

  <div id="mark">
    <svg viewBox="0 0 100 100" role="img" aria-label="d">
      <path d="M32 22 H50 A28 28 0 0 1 50 78 H32 Z" fill="none" stroke="#33b5e5" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="50" cy="50" r="4.5" fill="#fff"/>
    </svg>
  </div>

  <div id="powered"><div id="pb">powered by</div><div id="wm"><svg viewBox="0 0 100 100" role="img" aria-label="d">
<defs><linearGradient id="dd-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fc3ef"/><stop offset="1" stop-color="#0099cc"/></linearGradient><radialGradient id="dd-s" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#1c3442"/><stop offset="1" stop-color="#0a1218"/></radialGradient></defs>
  <circle cx="42" cy="60" r="22" fill="url(#dd-s)"/>
  <path d="M30 60 a12 12 0 0 1 12 -12" fill="none" stroke="#33b5e5" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  <circle cx="42" cy="60" r="4.5" fill="#33b5e5"/>
  <circle cx="42" cy="60" r="26" fill="none" stroke="url(#dd-g)" stroke-width="8"/>
  <rect x="64" y="10" width="8" height="80" rx="4" fill="url(#dd-g)"/>
</svg>roid</div></div>
</div>
<script>
  var intro = document.getElementById('intro');
  var flock = document.getElementById('flock');
  var timer = null;

  function pigeon() {
    return '<path d="M16 6 L20 8 L16 9.5Z" fill="#59606c"/>' +
      '<ellipse cx="10" cy="7.2" rx="7" ry="4" fill="#6b7482"/>' +
      '<circle cx="4.2" cy="4.4" r="2.4" fill="#7a8494"/>' +
      '<path d="M1.9 4 L0 4.9 L2 5.4Z" fill="#8a8f78"/>' +
      '<path class="wing" d="M8 5.6 Q13 0.5 18 3 Q13 6.2 8 7.4Z" fill="#9aa6b8"/>';
  }

  /* x, y, flight dx, dy, delay, duration */
  var birds = [
    [14, 49, -90, -70, .00, 1.8], [26, 52, -80, -85, .12, 2.0], [38, 47, -100, -60, .05, 1.7],
    [50, 53, -70, -90, .20, 2.1], [62, 48, -85, -75, .08, 1.9], [74, 52, -60, -88, .28, 2.2],
    [32, 46, -95, -80, .15, 1.8], [68, 46, -75, -66, .02, 1.6]
  ];
  flock.innerHTML = birds.map(function (b, i) {
    return '<g transform="translate(' + b[0] + ',' + b[1] + ') scale(.8)">' +
      '<g class="peck" style="animation-delay:' + (i * .13) + 's">' +
      '<g class="fly" style="--dx:' + b[2] + 'px;--dy:' + b[3] + 'px;--delay:' + (2.9 + b[4]) + 's;--dur:' + b[5] + 's">' +
      pigeon() + '</g></g></g>';
  }).join('');

  var d = 'M0 90 L0 60';
  for (var x = 0; x <= 160; x += 3) { d += ' L' + (x + 1) + ' ' + (56 + (x * 37) % 5) + ' L' + (x + 3) + ' 60'; }
  document.getElementById('grass').setAttribute('d', d + ' L160 90 Z');

  function start() {
    clearTimeout(timer);
    intro.classList.remove('run');
    void intro.offsetWidth;
    intro.classList.add('run');
    timer = setTimeout(function () { document.dispatchEvent(new CustomEvent('danen:intro-done')); }, 8800);
  }
  window.danenintro = { start: start };
  intro.addEventListener('click', start);
  start();
</script>
</body>
</html>
