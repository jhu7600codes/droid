name: danen store check
on:
  pull_request:
    paths: ['store/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/pack-dpk/examples.mjs
      - run: node tools/store/build-catalog.mjs --check
