<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#0a0d12;overflow:hidden;touch-action:none;user-select:none;font-family:Roboto,sans-serif}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Bounce Wall: drag the bar, keep the ball in play, break the wall. ten walls with their own shapes.
const cv = document.getElementById('c'), g = cv.getContext('2d')
let W, H, D
function fit() { D = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * D; cv.height = H * D; cv.style.width = W + 'px'; cv.style.height = H + 'px'; g.setTransform(D, 0, 0, D, 0, 0) }
addEventListener('resize', fit); fit()
droid.system.orientation('portrait').catch(() => {})
droid.actionbar.hide().catch(() => {})
const buzz = (ms) => droid.system.vibrate(ms).catch(() => {})
// ask for vibration once at launch, not in the middle of a game
buzz(1)
let best = 0
droid.prefs.get('best').then((v) => { best = +v || 0 })

const COLORS = ['#33b5e5', '#99cc00', '#ffbb33', '#ff4444', '#aa66cc', '#00ddff']
// each wall is a function (col, row) -> hits needed (0: empty)
const WALLS = [
  (c, r) => (r < 4 ? 1 : 0),
  (c, r) => (r < 6 ? 1 + (r < 2) : 0),
  (c, r) => (r < 7 && (c + r) % 2 === 0 ? 2 : 0),
  (c, r) => (r < 8 && Math.abs(c - 4.5) <= r * 0.7 ? 1 + (r % 3 === 0) : 0),
  (c, r) => (r < 8 && (c === 0 || c === 9 || r === 0 || r === 7) ? 3 : r < 8 ? 1 : 0),
  (c, r) => (r < 9 && c % 3 !== 1 ? 2 : 0),
  (c, r) => (r < 8 ? (Math.abs(c - 4.5) + Math.abs(r - 3.5) < 4.5 ? 3 : 1) : 0),
  (c, r) => (r < 10 && (r % 2 === 0 || c % 2 === 0) ? 2 : 0),
  (c, r) => (r < 9 ? 1 + ((c * 7 + r * 3) % 3) : 0),
  (c, r) => (r < 10 ? 3 : 0),
]
const COLS = 10
let level, lives, score, bricks, ball, bar, state = 'menu', stuck
function layout() {
  const bw = (W - 20) / COLS, bh = Math.min(24, H * 0.032)
  bricks = []
  for (let r = 0; r < 12; r++) for (let c = 0; c < COLS; c++) {
    const hp = WALLS[level](c, r)
    if (hp) bricks.push({ x: 10 + c * bw, y: 70 + r * bh, w: bw - 3, h: bh - 3, hp, max: hp })
  }
  bar = { w: W * 0.24, x: W / 2, y: H - 70 }
  ball = { x: W / 2, y: bar.y - 12, vx: 0, vy: 0, r: 7 }
  stuck = true
}
function start() { level = 0; lives = 3; score = 0; layout(); state = 'run' }
function launch() { if (!stuck) return; stuck = false; const sp = 330 + level * 28; const a = -Math.PI / 2 + (Math.random() - 0.5) * 0.6; ball.vx = Math.cos(a) * sp; ball.vy = Math.sin(a) * sp }

function update(dt) {
  if (state !== 'run') return
  if (stuck) { ball.x = bar.x; ball.y = bar.y - 12; return }
  const steps = 4
  for (let s = 0; s < steps; s++) {
    const h = dt / steps
    ball.x += ball.vx * h; ball.y += ball.vy * h
    if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx) }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx) }
    if (ball.y < 52 + ball.r) { ball.y = 52 + ball.r; ball.vy = Math.abs(ball.vy) }
    // the bar: where it hits sets the angle
    if (ball.vy > 0 && ball.y + ball.r >= bar.y && ball.y < bar.y + 14 && Math.abs(ball.x - bar.x) < bar.w / 2 + ball.r) {
      const k = (ball.x - bar.x) / (bar.w / 2), sp = Math.hypot(ball.vx, ball.vy) * 1.01
      const a = -Math.PI / 2 + k * 1.05
      ball.vx = Math.cos(a) * sp; ball.vy = Math.sin(a) * sp; ball.y = bar.y - ball.r; buzz(6)
    }
    for (const b of bricks) {
      if (b.hp <= 0) continue
      const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w)), ny = Math.max(b.y, Math.min(ball.y, b.y + b.h))
      if ((ball.x - nx) ** 2 + (ball.y - ny) ** 2 > ball.r ** 2) continue
      const ox = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r)), oy = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r))
      if (ox < oy) ball.vx = -ball.vx; else ball.vy = -ball.vy
      b.hp--; score += b.hp ? 5 : 20 + level * 5; if (!b.hp) buzz(12)
      break
    }
    if (ball.y > H + 20) {
      lives--; buzz(200)
      if (lives <= 0) { state = 'over'; if (score > best) { best = score; droid.prefs.set('best', best) } return }
      stuck = true; return
    }
  }
  if (!bricks.some((b) => b.hp > 0)) {
    level++
    if (level >= WALLS.length) { state = 'won'; if (score > best) { best = score; droid.prefs.set('best', best) } return }
    layout()
  }
}
function draw() {
  g.fillStyle = '#0a0d12'; g.fillRect(0, 0, W, H)
  g.fillStyle = '#fff'; g.font = '600 18px Roboto,sans-serif'; g.textAlign = 'left'; g.fillText('Score ' + (score || 0), 12, 32)
  g.textAlign = 'center'; g.fillText('Wall ' + ((level || 0) + 1), W / 2, 32)
  g.textAlign = 'right'; g.fillStyle = '#ff4444'; g.fillText('♥'.repeat(Math.max(0, lives || 0)), W - 12, 32)
  g.fillStyle = '#33b5e5'; g.fillRect(0, 48, W, 2)
  if (bricks) for (const b of bricks) {
    if (b.hp <= 0) continue
    g.fillStyle = COLORS[(b.max - 1 + Math.floor(b.y / 30)) % COLORS.length]
    g.globalAlpha = 0.45 + 0.55 * (b.hp / b.max); g.fillRect(b.x, b.y, b.w, b.h); g.globalAlpha = 1
    g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(b.x, b.y, b.w, 3)
  }
  if (bar) {
    g.fillStyle = '#e0e0e0'; g.fillRect(bar.x - bar.w / 2, bar.y, bar.w, 10)
    g.fillStyle = '#33b5e5'; g.fillRect(bar.x - bar.w / 2, bar.y, 8, 10); g.fillRect(bar.x + bar.w / 2 - 8, bar.y, 8, 10)
    g.fillStyle = '#fff'; g.shadowColor = '#33b5e5'; g.shadowBlur = 12; g.beginPath(); g.arc(ball.x, ball.y, ball.r, 0, 7); g.fill(); g.shadowBlur = 0
  }
  g.textAlign = 'center'
  if (state === 'run' && stuck) { g.fillStyle = '#9e9e9e'; g.font = '16px Roboto,sans-serif'; g.fillText('Tap to launch', W / 2, H * 0.62) }
  if (state !== 'run') {
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, 0, W, H)
    g.fillStyle = '#33b5e5'; g.font = '300 44px Roboto,sans-serif'; g.fillText(state === 'won' ? 'All walls down!' : 'Bounce Wall', W / 2, H * 0.36)
    g.fillStyle = '#fff'; g.font = '18px Roboto,sans-serif'
    if (state === 'over' || state === 'won') g.fillText('Score ' + score, W / 2, H * 0.45)
    g.fillText('Best ' + best, W / 2, H * 0.5)
    g.fillStyle = '#9e9e9e'; g.fillText('Drag anywhere to move the bar', W / 2, H * 0.58)
    g.fillStyle = '#fff'; g.font = '600 22px Roboto,sans-serif'; g.fillText(state === 'paused' ? 'Tap to go on' : 'Tap to play', W / 2, H * 0.68)
  }
}
let downX = 0, barAt = 0, dragged = false
addEventListener('pointerdown', (e) => { downX = e.clientX; barAt = bar ? bar.x : 0; dragged = false })
addEventListener('pointermove', (e) => {
  if (state !== 'run' || !(e.buttons || e.pointerType === 'touch')) return
  if (Math.abs(e.clientX - downX) > 4) dragged = true
  bar.x = Math.max(bar.w / 2, Math.min(W - bar.w / 2, barAt + (e.clientX - downX) * 1.3))
})
addEventListener('pointerup', () => {
  if (state === 'paused') { state = 'run'; return }
  if (state !== 'run') { start(); return }
  if (!dragged) launch()
})
droid.on('pause', () => { if (state === 'run') state = 'paused'; return null })
let last = performance.now()
function frame(t) { const dt = Math.min(0.033, (t - last) / 1000); last = t; update(dt); draw(); requestAnimationFrame(frame) }
requestAnimationFrame(frame)
</script>
</body>
</html>
