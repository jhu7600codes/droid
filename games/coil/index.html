<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#050a0f;overflow:hidden;touch-action:none;user-select:none;font-family:Roboto,sans-serif}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Coil: a glowing coil on a grid that grows with every spark it eats.
const cv = document.getElementById('c'), g = cv.getContext('2d')
let W, H, D, cell, cols = 18, rows = 26, ox, oy
function fit() {
  D = devicePixelRatio || 1; W = innerWidth; H = innerHeight
  cv.width = W * D; cv.height = H * D; cv.style.width = W + 'px'; cv.style.height = H + 'px'; g.setTransform(D, 0, 0, D, 0, 0)
  cell = Math.floor(Math.min(W / cols, (H - 70) / rows)); ox = (W - cell * cols) / 2; oy = 60 + (H - 60 - cell * rows) / 2
}
addEventListener('resize', fit); fit()
droid.system.orientation('portrait').catch(() => {})
droid.actionbar.hide().catch(() => {})
const buzz = (ms) => droid.system.vibrate(ms).catch(() => {})
// ask for vibration once at launch, not in the middle of a game
buzz(1)
let best = 0
droid.prefs.get('best').then((v) => { best = +v || 0 })

let body, dir, next, spark, state = 'menu', acc = 0, score = 0, tick = 0.16, glow = 0
function start() {
  body = [{ x: 8, y: 13 }, { x: 7, y: 13 }, { x: 6, y: 13 }]; dir = { x: 1, y: 0 }; next = dir
  score = 0; tick = 0.16; place(); state = 'run'
}
function place() {
  do spark = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) }
  while (body.some((b) => b.x === spark.x && b.y === spark.y))
}
function step() {
  dir = next
  const h = { x: body[0].x + dir.x, y: body[0].y + dir.y }
  if (h.x < 0 || h.y < 0 || h.x >= cols || h.y >= rows || body.some((b) => b.x === h.x && b.y === h.y)) {
    state = 'over'; buzz(250)
    if (score > best) { best = score; droid.prefs.set('best', best) }
    return
  }
  body.unshift(h)
  if (h.x === spark.x && h.y === spark.y) { score += 10; glow = 1; buzz(10); tick = Math.max(0.065, tick * 0.97); place() }
  else body.pop()
}
function turn(x, y) { if (state !== 'run') return; if (x === -dir.x && y === -dir.y) return; next = { x, y } }

function draw(dt) {
  g.fillStyle = '#050a0f'; g.fillRect(0, 0, W, H)
  g.strokeStyle = 'rgba(51,181,229,.08)'; g.lineWidth = 1
  for (let i = 0; i <= cols; i++) { g.beginPath(); g.moveTo(ox + i * cell, oy); g.lineTo(ox + i * cell, oy + rows * cell); g.stroke() }
  for (let j = 0; j <= rows; j++) { g.beginPath(); g.moveTo(ox, oy + j * cell); g.lineTo(ox + cols * cell, oy + j * cell); g.stroke() }
  g.strokeStyle = '#33b5e5'; g.lineWidth = 2; g.strokeRect(ox, oy, cols * cell, rows * cell)
  if (body) {
    glow = Math.max(0, glow - dt * 2)
    const t = performance.now() / 300
    g.fillStyle = '#ffbb33'; g.shadowColor = '#ffbb33'; g.shadowBlur = 12 + Math.sin(t) * 6
    g.beginPath(); g.arc(ox + (spark.x + 0.5) * cell, oy + (spark.y + 0.5) * cell, cell * 0.32, 0, 7); g.fill()
    g.shadowColor = '#33b5e5'; g.shadowBlur = 10 + glow * 20
    body.forEach((b, i) => {
      const k = 1 - i / (body.length + 6)
      g.fillStyle = `rgba(${51 + 120 * (1 - k) | 0},${181 * k + 60 | 0},229,${0.5 + 0.5 * k})`
      const pad = i === 0 ? 1 : 3
      g.fillRect(ox + b.x * cell + pad, oy + b.y * cell + pad, cell - pad * 2, cell - pad * 2)
    })
    g.shadowBlur = 0
  }
  g.fillStyle = '#fff'; g.font = '600 20px Roboto,sans-serif'; g.textAlign = 'left'; g.fillText('Score ' + score, 16, 36)
  g.textAlign = 'right'; g.fillStyle = '#9e9e9e'; g.fillText('Best ' + best, W - 16, 36)
  if (state !== 'run') {
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, 0, W, H); g.textAlign = 'center'
    g.fillStyle = '#33b5e5'; g.font = '300 48px Roboto,sans-serif'; g.fillText('Coil', W / 2, H * 0.38)
    g.fillStyle = '#fff'; g.font = '18px Roboto,sans-serif'
    if (state === 'over') g.fillText('Score ' + score, W / 2, H * 0.46)
    if (state === 'paused') g.fillText('Paused', W / 2, H * 0.46)
    g.fillStyle = '#9e9e9e'; g.fillText('Swipe to turn', W / 2, H * 0.54)
    g.fillStyle = '#fff'; g.font = '600 22px Roboto,sans-serif'; g.fillText('Tap to ' + (state === 'paused' ? 'go on' : 'play'), W / 2, H * 0.64)
  }
}
let sx, sy, swiped
addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; swiped = false })
addEventListener('pointermove', (e) => {
  if (swiped) return
  const dx = e.clientX - sx, dy = e.clientY - sy
  if (Math.hypot(dx, dy) < 20) return
  swiped = true
  Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy))
})
addEventListener('pointerup', () => { if (!swiped && state !== 'run') state === 'paused' ? (state = 'run') : start() })
addEventListener('keydown', (e) => {
  const k = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key]
  if (k) turn(k[0], k[1]); else if (state !== 'run' && (e.key === ' ' || e.key === 'Enter')) start()
})
droid.on('pause', () => { if (state === 'run') state = 'paused'; return null })
let last = performance.now()
function frame(t) {
  const dt = Math.min(0.1, (t - last) / 1000); last = t
  if (state === 'run') { acc += dt; while (acc >= tick && state === 'run') { acc -= tick; step() } }
  draw(dt); requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
