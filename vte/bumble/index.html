<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;min-height:100%;font-family:Roboto,sans-serif;-webkit-user-select:none;user-select:none}
.st{display:none;padding:40px 24px;text-align:center}.small{font-size:13px;opacity:.75}
body[data-state=loading] .st-loading,body[data-state=error] .st-error,body[data-state=nosim] .st-nosim{display:block}
body:not([data-state=ok]) .main{display:none}
button{font:500 14px Roboto,sans-serif;border:0;cursor:pointer}
#calls{list-style:none;margin:0;padding:0}#calls li{padding:8px 0;font-size:14px}#calls .none{opacity:.6}

body{background:#fff8e1;color:#3e2723}
.head{background:#ffc107;padding:16px 16px 28px;clip-path:polygon(0 0,100% 0,100% 80%,50% 100%,0 80%)}
.head small{font-weight:700;letter-spacing:2px;font-size:12px}.head .num{font-size:28px;font-weight:400;margin-top:4px}
.hive{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px 18px}
.hex{aspect-ratio:1/1.1;background:#ffca28;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hex:nth-child(2),.hex:nth-child(3){background:#ffb300}.hex b{font-size:26px}.hex span{font-size:12px;font-weight:500}
.fill{height:8px;background:#ffe082;border-radius:4px;margin:6px 18px;overflow:hidden}.fill i{display:block;height:100%;width:calc(var(--f)*100%);background:#3e2723}
.lbl{margin:10px 18px 0;font-size:13px;font-weight:500}
h3{margin:22px 18px 8px;font-size:15px;text-transform:uppercase;letter-spacing:1px}
#plans{padding:0 14px}.plan{background:#fff;border:2px solid #ffe082;border-radius:10px;padding:12px;margin-bottom:8px}.plan.cur{border-color:#3e2723}
.plan b{display:block}.plan span{font-size:13px}.plan button{display:block;margin-top:8px;background:#3e2723;color:#ffc107;padding:8px 12px;border-radius:6px}.plan button:disabled{background:#ffe082;color:#795548}
#calls{padding:0 18px}
.go{display:block;margin:22px auto 32px;background:#3e2723;color:#ffc107;padding:14px 26px;border-radius:8px;text-transform:uppercase}
.st button{background:#3e2723;color:#ffc107;padding:12px 22px;border-radius:8px}</style></head>
<body data-state="loading">

<div class="st st-loading">Loading…</div>
<div class="st st-error"><p data-v="error"></p><button data-act="retry">Try again</button></div>
<div class="st st-nosim"><p>You do not have a vSIM from Bumble Line yet.</p><p class="small">It is free. Get it on <b data-v="host"></b> in droid's Browser.</p><button data-act="get">Get a free vSIM</button></div>

<div class="main">
<div class="head"><small>BUMBLE LINE</small><div class="num" data-v="number"></div></div>
<div class="hive"><div class="hex"><b data-v="balance"></b><span>credit</span></div><div class="hex"><b data-v="vms"></b><span>VMS left</span></div><div class="hex"><b data-v="min"></b><span>minutes left</span></div><div class="hex"><b data-v="plan"></b><span>renews <i data-v="renews"></i></span></div></div>
<div class="lbl">VMS: <span data-v="vms"></span> of <span data-v="vms-total"></span></div><div class="fill" data-meter="vms"><i></i></div>
<div class="lbl">Minutes: <span data-v="min"></span> of <span data-v="min-total"></span></div><div class="fill" data-meter="min"><i></i></div>
<h3>Plans</h3><div id="plans"></div>
<h3>Buzz log</h3><ul id="calls"></ul>
<button class="go" data-act="messaging">Open Messaging</button>
</div>
<script>window.CARRIER = 'bumble'</script>
<script src="app.js"></script>
</body>
</html>
