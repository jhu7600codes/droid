<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;min-height:100%;font-family:Roboto,sans-serif;-webkit-user-select:none;user-select:none}
.st{display:none;padding:40px 24px;text-align:center}.small{font-size:13px;opacity:.75}
body[data-state=loading] .st-loading,body[data-state=error] .st-error,body[data-state=nosim] .st-nosim{display:block}
body:not([data-state=ok]) .main{display:none}
button{font:500 14px Roboto,sans-serif;border:0;cursor:pointer}
#calls{list-style:none;margin:0;padding:0}#calls li{padding:8px 0;font-size:14px}#calls .none{opacity:.6}

body{background:#eceff1;color:#263238}
.bar0{background:#2979ff;color:#fff;padding:16px}.bar0 small{font-size:12px;opacity:.8}.bar0 .num{font-size:26px;font-weight:300}
.sum{background:#fff;margin:12px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sum div{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #eceff1;font-size:15px}.sum div:last-child{border:0}.sum span:last-child{font-weight:500}
.use{background:#fff;margin:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.2)}.use small{font-size:12px;color:#607d8b}
.ln{height:4px;background:#cfd8dc;margin:6px 0 12px}.ln i{display:block;height:100%;width:calc(var(--f)*100%);background:#2979ff}
h3{margin:16px 14px 6px;font-size:13px;color:#2979ff;text-transform:uppercase;font-weight:500}
#plans{margin:0 12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}.plan{padding:12px 14px;border-bottom:1px solid #eceff1;display:flex;align-items:center;gap:10px}.plan.cur b::after{content:' ✓';color:#2979ff}
.plan b{display:block}.plan span{flex:1;font-size:12px;color:#607d8b}.plan button{background:none;color:#2979ff;text-transform:uppercase}.plan button:disabled{color:#b0bec5}
#calls{margin:0 12px;background:#fff;padding:4px 14px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.go{display:block;margin:20px auto 30px;background:#2979ff;color:#fff;padding:12px 26px;border-radius:2px;text-transform:uppercase}
.st button{background:#2979ff;color:#fff;padding:12px 22px;border-radius:2px}</style></head>
<body data-state="loading">

<div class="st st-loading">Loading…</div>
<div class="st st-error"><p data-v="error"></p><button data-act="retry">Try again</button></div>
<div class="st st-nosim"><p>You do not have a vSIM from Line Carrier yet.</p><p class="small">It is free. Get it on <b data-v="host"></b> in droid's Browser.</p><button data-act="get">Get a free vSIM</button></div>

<div class="main">
<div class="bar0"><small>Line Carrier · account</small><div class="num" data-v="number"></div></div>
<div class="sum"><div><span>Credit</span><span data-v="balance"></span></div><div><span>Plan</span><span data-v="plan"></span></div><div><span>Renews on</span><span data-v="renew-date"></span></div><div><span>Customer since</span><span data-v="since"></span></div><div><span>Past your plan</span><span><i data-v="vms-price"></i> / VMS · <i data-v="min-price"></i> / min</span></div></div>
<div class="use"><small>VMS left: <span data-v="vms"></span> of <span data-v="vms-total"></span></small><div class="ln" data-meter="vms"><i></i></div><small>Minutes left: <span data-v="min"></span> of <span data-v="min-total"></span></small><div class="ln" data-meter="min"><i></i></div><small>Sent today: <span data-v="sent-today">0</span></small></div>
<h3>Plans</h3><div id="plans"></div>
<h3>Call history</h3><ul id="calls"></ul>
<button class="go" data-act="messaging">Open Messaging</button>
</div>
<script>window.CARRIER = 'line'</script>
<script src="app.js"></script>
</body>
</html>
