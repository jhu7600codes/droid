<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;min-height:100%;font-family:Roboto,sans-serif;-webkit-user-select:none;user-select:none}
.st{display:none;padding:40px 24px;text-align:center}.small{font-size:13px;opacity:.75}
body[data-state=loading] .st-loading,body[data-state=error] .st-error,body[data-state=nosim] .st-nosim{display:block}
body:not([data-state=ok]) .main{display:none}
button{font:500 14px Roboto,sans-serif;border:0;cursor:pointer}
#calls{list-style:none;margin:0;padding:0}#calls li{padding:8px 0;font-size:14px}#calls .none{opacity:.6}

body{background:#e0f2f1;color:#004d40}
.ticket{margin:16px;background:#fff;border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.15);overflow:hidden}
.ticket .t1{background:#00bfa5;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline}
.t1 b{font-size:22px;font-weight:400}.t1 small{letter-spacing:2px;font-size:11px}
.ticket .t2{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px dashed #b2dfdb}
.t2 div{padding:12px;text-align:center;border-right:1px solid #e0f2f1}.t2 div:last-child{border:0}.t2 small{display:block;font-size:10px;color:#00897b;text-transform:uppercase;letter-spacing:1px}.t2 b{font-size:20px;font-weight:500}
.meter{margin:6px 16px 14px}.meter small{font-size:12px;color:#00796b}.bar{height:12px;background:#b2dfdb;margin-top:4px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:calc(var(--f)*100%);background:repeating-linear-gradient(90deg,#00bfa5 0 10px,#1de9b6 10px 20px)}
h3{margin:18px 16px 6px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#00796b}
#plans{padding:0 16px}.plan{background:#fff;padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;border-left:6px solid #b2dfdb}.plan.cur{border-left-color:#00bfa5}
.plan b{display:block}.plan span{flex:1;font-size:12px;color:#00796b}.plan button{background:#00bfa5;color:#fff;padding:8px 10px}.plan button:disabled{background:#e0f2f1;color:#00897b}
#calls{padding:0 16px}
.go{display:block;margin:20px auto 30px;background:#004d40;color:#a7ffeb;padding:14px 28px;text-transform:uppercase;letter-spacing:1px}
.st button{background:#00bfa5;color:#fff;padding:12px 22px}</style></head>
<body data-state="loading">

<div class="st st-loading">Loading…</div>
<div class="st st-error"><p data-v="error"></p><button data-act="retry">Try again</button></div>
<div class="st st-nosim"><p>You do not have a vSIM from Transfer yet.</p><p class="small">It is free. Get it on <b data-v="host"></b> in droid's Browser.</p><button data-act="get">Get a free vSIM</button></div>

<div class="main">
<div class="ticket"><div class="t1"><small>TRANSFER</small><b data-v="number"></b></div>
<div class="t2"><div><small>Credit</small><b data-v="balance"></b></div><div><small>Plan</small><b data-v="plan"></b></div><div><small>Renews</small><b data-v="renews"></b></div></div></div>
<div class="meter"><small>VMS <span data-v="vms"></span> / <span data-v="vms-total"></span></small><div class="bar" data-meter="vms"><i></i></div></div>
<div class="meter"><small>VoVTE minutes <span data-v="min"></span> / <span data-v="min-total"></span></small><div class="bar" data-meter="min"><i></i></div></div>
<h3>Plans</h3><div id="plans"></div>
<h3>Recent calls</h3><ul id="calls"></ul>
<button class="go" data-act="messaging">Open Messaging</button>
</div>
<script>window.CARRIER = 'transfer'</script>
<script src="app.js"></script>
</body>
</html>
